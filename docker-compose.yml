# 一键部署：docker compose up -d --build
# 导入示例数据（可选）：docker compose exec api node dist/database/seed.js
#
# 媒体存储默认存本地卷（uploads）。生产环境建议改用腾讯云 COS / 阿里云 OSS（见 .env.example）；
# 本地想体验 S3 存储可启用 MinIO：docker compose --profile minio up -d，并在 .env 设 STORAGE_DRIVER=s3
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zupu
      POSTGRES_USER: zupu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zupu_dev_pw}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zupu -d zupu"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zupu:${DB_PASSWORD:-zupu_dev_pw}@db:5432/zupu
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-zupu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zupu}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zupu_minio_pw}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zupu}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zupu_minio_pw}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

volumes:
  db-data:
  uploads:
  minio-data:
